[package]
name = "syn-vm"
description = "Виртуальные машины synshell на QEMU/KVM: создание по образу, встроенный экран, снимки, общие папки"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-vm"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "clipboard"] }
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
