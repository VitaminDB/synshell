[package]
name = "syn-blocks"
description = "Syn Blocks — головоломка 8×8 в духе Block Blast на syngui (бывший Elle Block); Linux и Android"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "syn_blocks"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "syn-blocks"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["syngui/clipboard"]
android = ["syngui/android"]

[dependencies]
synshell-tr.workspace = true
syngui = { workspace = true, features = ["msdf", "effects", "winit", "material-icons", "audio", "image", "i18n"] }
hound = "3.5"
log = "0.4"

[dev-dependencies]
syngui = { workspace = true, features = ["msdf", "effects", "winit", "material-icons", "audio", "image", "i18n", "testing"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# Android: syngui build -t android -p syn-blocks (gradle-проект генерируется в target/syngui/android).
[package.metadata.syngui]
id = "com.syngui.synblocks"
name = "Syn Blocks"
icon = "data/icons/syn-blocks.png"
description_en = "Syn Blocks: 8×8 block puzzle in the spirit of Block Blast"

[package.metadata.syngui.android]
features = ["android"]
default_features = false
abis = ["arm64-v8a"]
min_sdk = 30
target_sdk = 35
orientation = "portrait"
background = "#2f3db4"
fullscreen = true

[package.metadata.syngui.linux]
depends = ["synshell-core"]
