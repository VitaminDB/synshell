[package]
name = "syn-blocks"
description = "Syn Blocks — головоломка 8×8 в духе Block Blast на syngui (бывший Elle Block); Linux и Android"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "syn_blocks"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "syn-blocks"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["syngui/clipboard"]
android = ["syngui/android"]

[dependencies]
syngui = { workspace = true, features = ["msdf", "effects", "winit", "material-icons", "audio", "image"] }
hound = "3.5"
log = "0.4"

[dev-dependencies]
syngui = { workspace = true, features = ["msdf", "effects", "winit", "material-icons", "audio", "image", "testing"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
