[package]
name = "syn-notes"
description = "Заметки synshell: страницы-холсты, канбан, Гант, mindmap, календарь, графики, журнал и напоминания в одном .syn-проекте"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "syn-notes"
path = "src/main.rs"

[features]
default = []
testing = ["syngui/testing"]

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
syn-notes-proto.workspace = true
syngui = { workspace = true, features = [
    "winit",
    "msdf",
    "effects",
    "wayland-dnd",
    "material-icons",
    "tokio",
    "markdown",
    "markdown-syntax",
    "image",
    "image-network",
    "color-emoji",
    "svg",
    "clipboard",
    "audio",
    "ffmpeg",
    "document-editor",
    "i18n",
    "single-instance",
    "pen",
] }
synaptix-bundle = { workspace = true, features = ["sha256", "blake3"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
log = "0.4"
rand = "0.8"
sha2 = "0.10"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }
# Читалка (notes/reader): EPUB/FB2-архивы, кодировки TXT/FB2, Markdown;
# PDF — poppler-glib через dlopen (без него PDF недоступен, остальное работает).
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
libloading = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
# Рукописный ввод (notes/ink): файл .ink, растр страницы, вставка картинок.
postcard = { version = "1", default-features = false, features = ["alloc"] }
flate2 = "1"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
