[package]
name = "syn-netd"
description = "Несколько подключений к интернету одновременно: основной канал или оба (multipath), выбор для каждой программы, USB-модемы; учёт трафика программ и журнал соединений"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["daemon"]
# Сам демон; клиенту (Параметрам) нужен только протокол.
daemon = ["dep:libc", "dep:toml", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "synnetd"
path = "src/bin/synnetd/main.rs"
required-features = ["daemon"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
