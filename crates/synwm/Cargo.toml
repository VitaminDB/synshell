[package]
name = "synwm"
description = "Wayland compositor of the synwm desktop environment"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synwm"
path = "src/main.rs"

[features]
default = ["pixman"]
# CPU-рендер сеанса DRM (pixman + dumb-буферы) — телефоны без GBM/EGL.
pixman = ["smithay/renderer_pixman"]

[dependencies]
synshell-common.workspace = true
synshell-tr.workspace = true
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
libc.workspace = true
regex.workspace = true
bitflags = "2"
xcursor = "0.3"
# Рамки окон: растеризация фигур и текста заголовка на CPU.
tiny-skia = "0.11"
fontdue = "0.9"
# Снимки экрана.
png = "0.17"
# Матрицы для GlesFrame::render_texture (та же версия, что у smithay): анимация поворота.
cgmath = "0.18"
# Протокол меню приложений KDE (org_kde_kwin_appmenu).
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
# gtk_shell1 (protocols/gtk-shell.xml): глобальное меню GTK-программ.
wayland-server = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"

[build-dependencies]
# Аппаратный видеокодер V4L2 для потока кадров (src/v4l2enc.c).
cc = "1"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "xwayland",
]
