[package]
name = "syndesktop"
description = "Wayland compositor of the syndesktop desktop environment"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syndesktop"
path = "src/main.rs"

[dependencies]
syndesktop-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
libc.workspace = true
regex.workspace = true
bitflags = "2"
xcursor = "0.3"
# Рамки окон: растеризация фигур и текста заголовка на CPU.
tiny-skia = "0.11"
fontdue = "0.9"
# Снимки экрана.
png = "0.17"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "xwayland",
]
