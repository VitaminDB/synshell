[package]
name = "synkeyboard"
description = "On-screen keyboard of the synshell environment (layer-shell + zwp_virtual_keyboard_v1)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synkeyboard"
path = "src/main.rs"

[dependencies]
synshell-common.workspace = true
syngui-layer.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "svg", "material-icons", "i18n"] }
anyhow.workspace = true
log = "0.4"
env_logger = "0.11"
