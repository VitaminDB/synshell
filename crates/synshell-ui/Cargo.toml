[package]
name = "synshell-ui"
description = "Shared shell of the synshell environment: panels, docks, launcher, notifications, OSD, lock screen — used by the desktop and phone shells"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
syn-keyboard.workspace = true
synshell-common = { workspace = true, features = ["drives", "i18n", "thumbs"] }
syngui-layer.workspace = true
syn-system.workspace = true
synaptixd.workspace = true
syn-modem.workspace = true
syngui = { workspace = true, features = ["winit", "clipboard", "msdf", "effects", "svg", "material-icons", "i18n", "markdown-syntax", "ffmpeg", "sfx"] }
syn-assist.workspace = true
syn-notes-proto.workspace = true
syn-assist-voice.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
log = "0.4"
env_logger = "0.11"
zbus = "5"
# История буфера обмена: свой клиент wlr-data-control (как у synlink) и картинки.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
