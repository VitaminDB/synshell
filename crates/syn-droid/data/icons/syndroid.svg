<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- syndroid: Android в контейнере synshell — голова «дроида» над стопкой слоёв (образы, контейнер) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE895"/>
      <stop offset="0.55" stop-color="#1FB673"/>
      <stop offset="1" stop-color="#0A6B4E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4FFF1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#053D2C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <path d="M34 4h60a30 30 0 0 1 30 30v14C96 58 32 58 4 48V34A30 30 0 0 1 34 4z" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <!-- голова выглядывает из окна -->
    <path d="M30 76a34 34 0 0 1 68 0z" fill="url(#head)"/>
    <line x1="48" y1="47" x2="40" y2="33" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="80" y1="47" x2="88" y2="33" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- окно synshell -->
    <rect x="18" y="74" width="92" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.94"/>
  </g>
  <circle cx="52" cy="62" r="4.6" fill="#0C7A55"/>
  <circle cx="76" cy="62" r="4.6" fill="#0C7A55"/>
  <circle cx="30" cy="84" r="3" fill="#1FB673"/>
  <circle cx="39.5" cy="84" r="3" fill="#1FB673" fill-opacity="0.6"/>
  <circle cx="49" cy="84" r="3" fill="#1FB673" fill-opacity="0.35"/>
  <rect x="26" y="92" width="76" height="13" rx="4" fill="#0C7A55" fill-opacity="0.16"/>
</svg>
