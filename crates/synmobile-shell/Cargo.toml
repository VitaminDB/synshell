[package]
name = "synmobile-shell"
description = "Mobile shell of the synshell environment: status bar, home screen, navigation bar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synmobile-shell"
path = "src/main.rs"

[dependencies]
synshell-common.workspace = true
syngui-layer.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "svg", "material-icons", "i18n"] }
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
env_logger = "0.11"
