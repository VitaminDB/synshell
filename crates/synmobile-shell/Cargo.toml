[package]
name = "synmobile-shell"
description = "Mobile shell of the synshell environment: home screen with pages, gesture commands, and the shared panels/docks/launcher of synshell-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synmobile-shell"
path = "src/main.rs"

[dependencies]
libc.workspace = true
synshell-common.workspace = true
synshell-ui.workspace = true
syngui-layer.workspace = true
synsystem.workspace = true
synmodem.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "svg", "material-icons", "i18n"] }
log = "0.4"
