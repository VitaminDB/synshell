[package]
name = "syn-node-editor"
description = "Редактор узлов Synthos и видеоредактора synshell: холст с панорамой и щипком, ноды, порты, провода, палитра, поля, сохранение графа, прогон через synaptix-flow, звуковые ноды; свои виды нод — регистрацией в реестре"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
testing = ["syngui/testing"]

[dependencies]
syngui = { workspace = true, features = [
    "material-icons",
    "tokio",
    "markdown",
    "image",
    "audio",
    "ffmpeg",
    "i18n",
] }
synaptix-flow.workspace = true
synaptixd.workspace = true
synaptix-core.workspace = true
synaptix-kernels-cpu.workspace = true
# load_image_rgba / save_image для нод Image и Image Save.
synaptix-io = { workspace = true, features = ["image"] }
# sinc-ресемплинг в микшере (несовпадающие частоты входов).
synaptix-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror = "2"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "isomp4", "aac", "vorbis", "ogg"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
