[package]
name = "syn-courier"
description = "Курьер: связь с системой через мессенджеры (WhatsApp, позже Telegram и почта) — уведомления и разговор с Claude Code"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["daemon"]
# Сама служба; оболочке и Параметрам нужен только протокол.
daemon = ["dep:tokio", "dep:whatsapp-rust", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber", "dep:zbus", "dep:qrcode", "dep:synshell-common", "dep:reqwest", "dep:hmac", "dep:sha2"]

[[bin]]
name = "syncourier"
path = "src/bin/syncourier/main.rs"
required-features = ["daemon"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"], optional = true }
whatsapp-rust = { version = "0.7", optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Уведомления системы: монитор шины сеанса (как у synshell-common — без своего исполнителя).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# Telegram Bot API.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"], optional = true }
# Пульт (мини-приложение Telegram): проверка подписи initData — HMAC-SHA256.
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
# QR-код привязки в терминале (`syncourier link`).
qrcode = { version = "0.14", default-features = false, optional = true }
# Простой пользователя (synwm IPC) — режим «когда меня нет».
synshell-common = { workspace = true, optional = true }
