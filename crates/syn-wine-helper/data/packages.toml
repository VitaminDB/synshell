# База syn-wine-helper: только DLL, которых нет в самом Wine, — без них программа не запускается
# («Library X (which is needed by …) not found»). Рантаймы, у которых в Wine есть своя реализация
# (msvcr*/msvcp*/vcruntime140, d3dx9, xact, xinput, msxml, gdiplus…), сюда не входят: Wine находит их сам.
#
# [[source]] — файл для скачивания: адреса по порядку, затем те же адреса в архиве web.archive.org;
# размер и sha256 обязательны (файл с другим содержимым не принимается).
# [[package]] — что ставится: `dlls` — имена; [package.x86]/[package.x64] — из какого источника.
# Внутри источника DLL ищутся по самому PE (имя в таблице экспорта и тип машины) во вложенных
# CAB/MSI/ZIP/NSIS — имена файлов в контейнерах не важны. `files` — явный путь в контейнере (шаблон с *)
# для DLL под другим именем.
#
# Свои пакеты — в $XDG_DATA_HOME/syn-wine/packages.toml в том же виде (дополняют и заменяют эти по id).

