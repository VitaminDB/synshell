[package]
name = "synfsd"
description = "Журнал изменений файлов: какая программа что создала, изменила, удалила или переименовала (fanotify)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["daemon"]
# Сам демон; клиенту (проводнику) нужен только протокол.
daemon = ["dep:rusqlite", "dep:libc", "dep:toml", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "synfsd"
path = "src/bin/synfsd/main.rs"
required-features = ["daemon"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", optional = true }
libc = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
