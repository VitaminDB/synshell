[package]
name = "syn-vm-agent"
description = "Гостевой агент syn-vm: команды (в том числе в сеансе пользователя), файлы, журналы гостя — Windows и Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "syn-vm-agent"
path = "src/main.rs"
required-features = ["std"]

# Протокол (lib) собирается и без std — для агентов старых систем (legacy/: Windows 9x/XP, DOS).
[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "sha2/std", "dep:png", "dep:windows-sys", "dep:libc"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
png = { version = "0.17", optional = true }
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_EventLog",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_System_DataExchange",
    "Win32_Graphics_Gdi",
] }
