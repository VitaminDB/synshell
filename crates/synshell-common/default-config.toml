# ─────────────────────────────────────────────────────────────────────────────
#  synshell — конфигурация рабочего стола
#
#  Файл перечитывается на лету: сохраните — и изменения применятся.
#  Любую секцию и любое поле можно удалить — возьмётся значение по умолчанию.
#  То же самое настраивается в «Параметрах системы» (synsettings).
# ─────────────────────────────────────────────────────────────────────────────

[general]
terminal = "konsole"
file_manager = "synfiles"
browser = "xdg-open https://"
# Оболочка: панели, меню запуска, уведомления. Пусто — без оболочки
# (например, если вы запускаете waybar через autostart).
shell = "syndesktop-shell"
# Команды при входе в сеанс.
autostart = []
# Запускать ~/.config/autostart/*.desktop
xdg_autostart = true
# Xwayland для X11-программ (нужен пакет xorg-xwayland).
xwayland = true
screenshot_dir = "~/Pictures/Screenshots"
language = ""                  # язык интерфейса: ru | en | …; пусто — язык системы (LANG)

[general.environment]
# QT_QPA_PLATFORMTHEME = "kde"

# Платформа: десктоп или телефон.
[platform]
# Рендерер сеанса DRM: "auto", "gpu" (GLES через GBM/EGL; на телефоне с Android-ядром — zink поверх
# turnip) или "cpu" (pixman + dumb-буферы). auto — проба EGL в отдельном процессе, при неудаче — cpu.
renderer = "auto"
# "auto", "desktop" или "phone": на телефоне окна во весь экран, без рамок,
# оболочка synmobile-shell. auto — телефон, если единственный монитор — DSI-панель.
form_factor = "auto"
# Выходы, которые никогда не включаются (шаблоны с *): writeback-коннекторы
# downstream-драйверов ("Virtual-1") иначе отбирают CRTC у панели.
ignore_outputs = ["Virtual-*"]

[appearance]
# Тема оформления: nord, catppuccin, tokyo-night, gruvbox, rose-pine,
# everforest, dracula, kanagawa, solarized, synthwave, aurora, sakura,
# brutal, terminal или своя из ~/.config/synshell/themes/<имя>/.
# Пусто — стандартная.
theme = ""
color_scheme = "dark"          # dark | light (вариант темы)
accent = ""                    # пусто — акцент темы, иначе #rrggbb
font = ""                      # пусто — системный шрифт
font_size = 13.0
icon_theme = "breeze-dark"
cursor_theme = "breeze_cursors"
cursor_size = 24
cursor_hide = "touch"            # never | touch (при касании экрана) | always (телефон/планшет)
corner_radius = 10.0
panel_opacity = 0.92
ui_scale = 1.0
# Перекрашивать программы под тему: GTK 3/4 (Breeze, libadwaita), Qt/KDE
# (цветовая схема Syndesktop в kdeglobals) и GIMP 3.
app_colors = true

[appearance.colors]
# Переопределение цветов палитры поверх темы: bg, surface, surface_alt, fg, muted,
# border, accent_fg, danger, success, warning.
# bg = "#101010"

[input.keyboard]
layouts = "us,ru"
variants = ""
options = "grp:alt_shift_toggle"
model = ""
repeat_delay = 400
repeat_rate = 30
numlock = true
per_window_layout = false

[input.mouse]
accel_speed = 0.0              # -1.0 .. 1.0
accel_profile = "adaptive"     # adaptive | flat
natural_scroll = false
left_handed = false
scroll_factor = 1.0
middle_emulation = false

[input.touchpad]
tap = true
tap_drag = true
natural_scroll = true
disable_while_typing = true
accel_speed = 0.2
accel_profile = "adaptive"
left_handed = false
scroll_factor = 1.0
scroll_method = "two-finger"   # two-finger | edge | none
click_method = "clickfinger"   # clickfinger | button-areas
middle_emulation = false

# Мониторы. Без секций — все включены в предпочтительном режиме, слева направо.
# [[output]]
# name = "eDP-1"
# mode = "1920x1080@60"
# scale = 1.25
# position = [0, 0]
# transform = "normal"         # normal | 90 | 180 | 270 | flipped | flipped-90 | ...
# vrr = false
# primary = true
# max_nits = 1000              # яркость панели на максимуме — яркость в нитах в Параметрах

[windows]
focus_mode = "click"           # click | sloppy | follow-mouse
raise_on_focus = true
autoraise_delay = 250
decorations = "server"         # server | client
placement = "center"           # center | cascade | under-mouse | smart
mod_key = "Super"              # модификатор: перетаскивание ЛКМ, размер ПКМ
border_width = 2
gaps_inner = 8
gaps_outer = 8
default_layout = "floating"    # floating | tile | columns | grid | monocle
master_ratio = 0.55
master_count = 1
new_is_master = false
snap = true
snap_distance = 12
edge_tiling = true
titlebar_double_click = "toggle-maximize"
titlebar_middle_click = "minimize"
titlebar_wheel = "none"
hide_cursor_after = 0
dim_inactive = 0.0
focus_stealing = false
borderless_maximized = false   # развёрнутые окна без заголовка — его заменяет панель

[decorations]
title_height = 32
font_size = 13.0
title_align = "center"         # left | center
# Кнопки: левые:правые. icon, sticky, above, minimize, maximize, close
buttons = "icon:minimize,maximize,close"
corner_radius = 10.0
resize_border = 8
shadow = true
shadow_size = 22
shadow_opacity = 0.45
active_color = "theme"         # theme | accent | surface | bg | #rrggbb
inactive_color = "theme"

[animations]
enabled = true
speed = 1.0                    # 0.5 — быстрее, 2.0 — медленнее
window_open = "zoom"           # zoom | fade | slide | none
window_close = "zoom"
workspace_switch = "slide"     # slide | slide-vertical | fade | none
minimize = "zoom"
layout_changes = true
shell = true                   # всплывающие окна, меню запуска, уведомления, OSD
theme_change = true            # плавная смена темы и обоев
reduce_motion = false          # меньше движения: короче переходы, без частиц и волн
home = true                    # домашний экран телефона: листание страниц, появление
menu = true                    # меню запуска: появление, перетекание в «Все приложения»
shade = true                   # шторка и быстрые настройки
dock = true                    # док и панели: увеличение значков, прыжки при запуске
particles = true               # частицы (док, запуск приложений)
blur = true                    # размытие под меню (дорого на CPU-композиторе телефона)
ripple = true                  # волна от точки нажатия
pages = true                   # листание приложений и смена режима окон (телефон)

[workspaces]
count = 4
names = []
wrap = true
back_and_forth = false

[workspaces.layouts]
# "3" = "tile"

# Правила окон: все заданные условия (регулярные выражения) должны совпасть.
# [[rule]]
# app_id = "^org\\.kde\\.kcalc$"
# floating = true
# center = true
#
# [[rule]]
# app_id = "firefox"
# workspace = 2
#
# [[rule]]
# title = "Picture-in-Picture"
# always_on_top = true
# sticky = true
#
# Касания как мышь (программа не умеет тач; по умолчанию — у X11-окон Wine, класс *.exe):
# [[rule]]
# app_id = "\\.exe$"
# touch_as_mouse = true

# Сочетания клавиш. Дополняют встроенные; "none" снимает встроенное.
# Действия: spawn <cmd>, close, kill, toggle-floating, toggle-fullscreen,
# toggle-maximize, minimize, toggle-sticky, toggle-always-on-top,
# snap left|right|up|down, center, focus <dir>, move <dir>, focus-next,
# focus-prev, workspace <N|next|prev|last>, move-to-workspace <…>,
# move-to-workspace-follow <…>, focus-output <dir>, move-to-output <dir>,
# layout <kind>, cycle-layout, master-ratio <±x>, master-count <±n>,
# keyboard-layout-next, keyboard-layout <n>, screenshot, screenshot-window,
# screenshot-interactive (Print: выбор области, сохранить/копировать),
# overview, reload-config, restart-shell, restart, quit, lock, suspend, reboot, poweroff,
# monitors-off, shell <launcher|run|power-menu|notifications|volume ±n|…>
[keybindings]
# "Super+Return" = "spawn foot"
# "Super+B" = "spawn firefox"
# "Super+Q" = "none"

[wallpaper]
path = ""                      # картинка или каталог (слайд-шоу)
mode = "fill"                  # fill | fit | stretch | center | tile
color = ""                     # пусто — обои темы
color2 = ""                    # второй цвет — градиент, если нет картинки
slideshow_minutes = 0
desktop_icons = false
layout = "same"                # same — одни на всех столах | workspace — свои у каждого стола |
                               # panorama — одна картинка на все столы, сдвигается при переключении
zoom = 1.0                     # кадр: масштаб относительно «заполнить экран» (mode = "fill")
center = [0.5, 0.5]            # кадр: точка картинки в центре экрана, доли ширины и высоты
panorama_shift = 0.5           # панорама: сдвиг на один стол, доля ширины экрана
# [wallpaper.panorama_desk.2]     # панорама: свой участок картинки для стола 2 (кадр под экран)
# zoom = 1.5
# center = [0.7, 0.5]

# Свои обои стола при layout = "workspace" (номер стола с 1):
# [wallpaper.workspace.2]
# path = "~/Pictures/forest.jpg"
# zoom = 1.3
# center = [0.4, 0.5]

[wallpaper.per_output]
# "HDMI-A-1" = "~/Pictures/other.jpg"

# Сетка виджетов и значков рабочего стола. Сами виджеты — [[widget]]; их
# добавляют и настраивают удержанием (правым щелчком) на рабочем столе.
[desktop]
cell = 96                      # клетка на компьютере, px
phone_row = 100                # высота строки на телефоне, px (колонок — [mobile] home_columns)
# [[widget]]
# type = "cpu"                 # clock | cpu | memory | gpu | battery | network | temps | apps |
#                              # launcher | note | app | file
# page = 1                     # стол (с 1), 0 — на всех
# x = 0                        # клетка слева сверху (с 0)
# y = 0
# w = 4                        # ширина и высота в клетках (0 — до края)
# h = 3
# view = "line"                # вид: card | ring | gauge | line | bars | pie | radar | text …

# Панели. Их может быть сколько угодно, на любом крае и мониторе.
# form_factor: desktop (по умолчанию) | phone | any — на телефоне панелей по
# умолчанию нет, их добавляют удержанием на рабочем столе.
[[panel]]
form_factor = "desktop"
output = "*"                   # * | primary | имя монитора
edge = "bottom"                # top | bottom | left | right
size = 46
floating = true
defloat = "never"              # never | maximized | touch — прижиматься к краю во всю длину,
                               # когда окно развёрнуто или касается панели (как в Plasma 6)
defloated_size = 0             # толщина прилипшей панели; 0 — как size
length = 1.0
align = "center"
autohide = false
autohide_delay = 1500          # мс до скрытия после ухода курсора (отрыва пальца)
exclusive = true
applets = [
    { type = "launcher" },
    { type = "workspaces" },
    { type = "taskbar" },
    { type = "spacer" },
    { type = "tray" },
    { type = "keyboard" },
    { type = "volume" },
    { type = "link" },
    { type = "network" },
    { type = "battery" },
    { type = "notifications" },
    { type = "clock" },
    { type = "power" },
]
# link — связанные устройства (synlink): телефон по USB/Wi-Fi, экран, файлы, снимок, ssh.
# Другие апплеты: separator, show-desktop, layout, cpu, memory,
# button (icon, label, action), command (command, interval, action),
# clock (format = "%H:%M", date_format = "%a, %d %b", seconds = false),
# taskbar (labels = true, group = false, all_workspaces = false),
# tray (hide_passive = true, icon_size = 20, max_visible = 0 — сколько
# значков на панели, остальные под стрелкой «скрытые значки»),
# app — значок запуска (app = "firefox", name, icon, command, label),
# group — раздел со всплывающим окном (name, icon, items = ["code", "~/Проекты"],
#   view = "grid" | "list" | "fan", open = "click" | "hover"),
# folder — содержимое каталога (path = "xdg:DOWNLOAD" | "trash:" | "~/…", name, view, open).
# Панель как заголовок развёрнутого окна (с [windows] borderless_maximized = true):
# window-title (only_maximized = true, icon = true, text = "title" | "app" | "both",
#   max_width = 480; двойной щелчок — развернуть, перетащить — вытащить окно),
# window-buttons (only_maximized = true, buttons = "minimize,maximize,close"),
# appmenu — глобальное меню программы (Qt/KDE, GTK3 с GtkApplication, GIMP; only_maximized = false, app_name = false).
# Значки, разделы и папки удобнее добавлять мышью: правый клик по панели →
# «Изменить панель» (перетаскивание, ×, +).

# Док (как в macOS): mode = "dock". Подробно — docs/DOCK.md.
# [[panel]]
# mode = "dock"
# edge = "bottom"
# exclusive = false
# applets = [
#     { type = "launcher" },
#     { type = "separator" },
#     { type = "app", app = "org.kde.dolphin" },
#     { type = "app", app = "firefox" },
#     { type = "group", name = "Разработка", view = "fan", items = ["org.kde.konsole", "code"] },
#     { type = "taskbar" },
#     { type = "separator" },
#     { type = "folder", path = "xdg:DOWNLOAD", name = "Загрузки" },
#     { type = "folder", path = "trash:" },
# ]
# [panel.dock]
# icon_size = 48
# zoom = 1.7                  # увеличение под курсором (1 — нет)
# zoom_range = 2.5
# style = "glass"             # glass | shelf | flat | neon | none
# labels = true
# indicator = "dot"           # dot | dots | line | glow | none
# hover_effect = "lift"       # lift | tilt | spin | glow | none
# hover_particles = "none"    # sparkle | magic | embers | bubbles | hearts | snow | trail | none
# launch_animation = "bounce" # bounce | pulse | spin | none
# launch_particles = "stars"  # stars | sparkle | confetti | fireworks | magic | poof | none
# intellihide = false         # прятать, когда окно перекрывает док

[launcher]
style = "win11"                # win11 — как Windows 11 | menu — с разделами | fullscreen — сетка
favorites = ["org.kde.konsole", "org.kde.dolphin", "firefox", "synsettings"]
show_categories = true
show_recent = true
columns = 5
width = 640
height = 560
align = "icon"                 # icon — по центру кнопки | center — по центру дока | start | end
search_keywords = true
calculator = true
run_commands = true

[files]
view = "details"               # details | list | tiles | icons
icon_size = 64                 # значки в виде icons, px
sort_by = "name"               # name | modified | type | size
sort_descending = false
folders_first = true
show_hidden = false
single_click = false           # открывать одним щелчком
confirm_trash = false          # спрашивать перед удалением в корзину
preview_pane = false           # панель просмотра справа
thumbnails = true
thumbnail_max_mb = 64
pinned = []                    # закреплённые папки: ["~/Projects", "/mnt/data"]
restore_tabs = true

[notifications]
enabled = true
position = "auto"              # auto (телефон — top, компьютер — top-right) | top-left | top | top-right | bottom-left | bottom | bottom-right
timeout = 6000
critical_timeout = 0
max_visible = 5
width = 380
do_not_disturb = false
history = true
history_size = 100

[lock]
command = ""                   # пусто — встроенный экран блокировки; или "swaylock -f"
before_sleep = true
method = "password"             # password — пароль (PAM) | swipe — свайпом (на телефоне по умолчанию)

[idle]
dpms_after = 600               # секунды, 0 — никогда
lock_after = 0
suspend_after = 0

# Телефон (form_factor = phone).
[mobile]
mode = "pages"                 # pages — приложения во весь экран, листание вбок
                               # free — свободные окна на большом столе (пан двумя пальцами)
desk = "3x3"                   # размер виртуального стола в free: 2x2 | 3x3 | infinite
handle = "server"              # ручка окна в free: server | none
handle_height = 28
back_key = "XF86Back"          # клавиша «назад» для окна: XF86Back | Escape | Alt+Left
pinch_zoom = false             # щипок уменьшает вид стола в free; тап по окну — обратно 1:1
remember_mode = true           # запоминать выбранный режим окон
resources_page = true          # первая страница домашнего экрана — ресурсы
home_apps = []                 # приложения на домашнем экране; пусто — все
home_columns = 4
launcher = "pages"             # «Пуск»: pages — значки по страницам, list — закреплённые и список
double_tap_wake = true         # двойной стук по погашенному экрану включает его (датчики SLPI)
raise_to_wake = false          # поднять телефон — экран включается
flip_to_dnd = false            # экраном вниз — «Не беспокоить», пока телефон лежит так

# Сенсорные жесты (действия — как в [keybindings]).
[gestures]
enabled = true
edge_size = 24                 # зона у края экрана, px
threshold = 48                 # путь до распознавания жеста, px
tap_slop = 10
long_press_ms = 450            # удержание = правая кнопка
velocity = 0.5                 # скорость броска для перелистывания, px/мс
edge_left = "back"             # свайп от левого края
edge_right = "back"
edge_bottom = "shell home"     # свайп снизу вверх
edge_bottom_hold = "shell recents"  # свайп снизу с задержкой пальца
edge_top = "shell shade"       # свайп сверху — шторка
two_finger_pan = true          # двумя пальцами двигать стол (free)
long_press_window = "none"     # none | move — удержание по окну тащит его
touchpad_horizontal = "workspace next"
touchpad_up = "overview"

# Экранный ввод: клавиатура synkeyboard и контроллер syngamepad (телефон).
# Режим — keyboard (клавиатура на текстовом поле), controller (контроллер поверх
# приложения, клавиатура — кнопкой в шторке), off (ничего не выезжает). Свой режим приложения выбирается в
# шторке, плитка «Ввод», и пишется в [osk.apps].
[osk]
scale = 1.0
mode = "keyboard"
gamepad_layout = "standard"

# Виброотклик (телефон, вибромотор с force feedback).
[haptics]
enabled = true
strength = 70                  # сила, %
gestures = true                # жесты от краёв: назад, домой, шторка, «Недавние»
keyboard = true                # экранная клавиатура
touch = true                   # удержание пальцем (выбор, меню), переключатели
notifications = true           # уведомления (кроме «Не беспокоить»)

# Поворот встроенного экрана по акселерометру (iio-sensor-proxy), как в Android.
[rotation]
auto = true                    # автоповорот; выключен — ориентация зафиксирована
suggest = true                 # при фиксации: кнопка «повернуть», когда телефон повернули
upside_down = false            # поворачивать и «вверх ногами»

# Автояркость по датчику освещённости (iio-sensor-proxy); сдвиг ползунка при включённой — поправка к кривой.
[brightness]
auto = false
min_pct = 2                    # в темноте
max_pct = 100                  # на солнце
smooth_ms = 800                # переход светлее; темнее — вдвое медленнее
offset = 0                     # поправка к кривой, %: сдвиг ползунка при автояркости, сохраняется сам

[sound]
overamplify = false            # громкость выше 100 % (до 150 %): для тихих записей, громкие искажаются

# Дата и время. Пояс и синхронизация часов по сети — системные (timedatectl,
# «Параметры → Дата и время»); здесь — что делает оболочка.
[time]
# auto_timezone = true         # пояс по сети (внешний IP); не задано — на телефоне да, на десктопе нет


[link]
# Связь с другими оболочками synshell (телефон ↔ компьютер): демон synlink.
# По USB соединение и спаривание автоматические (на телефоне — одно
# подтверждение), по Wi-Fi — спаривание со сверкой кода на обоих экранах.
enabled = true
# Имя этой машины для других устройств (пусто — имя хоста).
name = ""
# Видна ли машина в Wi-Fi для спаривания (спаренные соединяются всегда).
discoverable = true
# Пересылать уведомления между устройствами.
notifications = true
# Общий буфер обмена: скопированный текст сразу вставляется на другом устройстве.
clipboard = true
# Монтировать файлы соединённых устройств (Проводник → Устройства).
auto_mount = true
# UDP-порт QUIC; поиск устройств — на порту на единицу меньше.
port = 47471

[location]
# Местоположение для программ (GeoClue; на телефоне — спутники модема).
# Выключено — не получает никто. Остальных оболочка спрашивает при первом
# запросе; «Разрешить»/«Запретить» запоминаются здесь (id .desktop).
enabled = true
allowed = []
denied = []

[wifi]
backend = "auto"               # auto | iwd | networkmanager

# X11-программы (Xwayland): какой экран они видят. Меньше пикселей — крупнее интерфейс
# программы (и быстрее игры): композитор растягивает её окна на экран.
# native — пиксели экрана (по умолчанию), logical — как у Wayland-программ,
# 1920x864 — ширина×высота (ориентация не важна), 720p — короткая сторона, 50% — доля пикселей.
[x11]
resolution = "native"
# Разрешения, которые Wine-игры видят как режимы экрана и выбирают в своих настройках
# (выбранное растягивается на экран; 720p — в пропорциях экрана, без полос).
modes = ["1080p", "900p", "720p", "600p", "540p", "480p"]
# DPI для программ, которые его читают (GTK, Qt, Steam); 0 — по разрешению. Игры его не замечают.
dpi = 0

# Своё разрешение для отдельных программ (отдельный Xwayland). name — без учёта регистра,
# * — любые символы: имя exe Wine-игры или steam:<AppId>. Запускалка узнаёт дисплей
# командой `synwm msg x11-display ИМЯ…` (wine-arm64ec в Steam делает это сама).
# [[x11_app]]
# name = "HeroesOldenEra.exe"
# resolution = "720p"

# Установка программ (synpkg).
[packages]
aur = true
build_user = ""                # от чьего имени собирать AUR (makepkg не работает от root)
check_hours = 6                # проверять обновления раз в N часов (0 — нет)
ignore = []                    # не обновлять эти пакеты
view = "cards"                 # вид списков пакетов: "cards" (карточки) или "list" (строки)
