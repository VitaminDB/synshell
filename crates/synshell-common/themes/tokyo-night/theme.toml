name = "Tokyo Night"
description = "Огни ночного Токио: глубокий индиго, неоновые синий и фиолетовый с подсветкой."
author = "synshell (палитра — enkia/tokyo-night)"

[appearance]
corner_radius = 10
panel_opacity = 0.9

[decorations]
corner_radius = 10
title_align = "center"

[panel]
# Толщина плавающей панели и прилипшей к краю (defloat).
size = 44
defloated_size = 38

[dark]
bg = "#16161e"
surface = "#1a1b26"
surface_alt = "#24283b"
fg = "#c0caf5"
muted = "#8089b3"
border = "#292e42"
accent = "#7aa2f7"
accent_fg = "#16161e"
danger = "#f7768e"
success = "#9ece6a"
warning = "#e0af68"
wallpaper = "linear-gradient(180deg, #0c0c14 0%, #16161e 35%, #1f2335 60%, #3b2f5c 85%, #7a4a8c 100%)"
wallpaper_color = "#16161e"
titlebar = "#1a1b26"
titlebar_inactive = "#16161e"
shadow = "#05050a99"

[dark.vars]
magenta = "#bb9af7"
cyan = "#7dcfff"
neon = "#7aa2f766"
neon-soft = "#7aa2f71f"

[light]
bg = "#d5d6db"
surface = "#e1e2e7"
surface_alt = "#cfd1db"
fg = "#343b58"
muted = "#6172b0"
border = "#b8bcd0"
accent = "#2e7de9"
