name = "Gruvbox"
description = "Тёплое ретро: охра, ржавчина и пожелтевшая бумага. Жёсткие углы и крупные подписи."
author = "synshell (палитра — morhetz/gruvbox)"

[appearance]
corner_radius = 4
panel_opacity = 0.97

[decorations]
corner_radius = 4
title_align = "left"

[panel]
