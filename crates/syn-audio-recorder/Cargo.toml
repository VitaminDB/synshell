[package]
name = "syn-audio-recorder"
description = "Диктофон synshell на syngui: живая волна записи, выбор микрофона, системное шумоподавление, Opus/FLAC/WAV через ffmpeg, список записей с плеером"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-audio-recorder"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n", "style"] }
synsystem.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "ffmpeg", "audio", "image"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
