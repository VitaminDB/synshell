[package]
name = "syn-video-player"
description = "Видеоплеер synshell на ffmpeg и syngui: аппаратное декодирование (V4L2 на телефонах, VAAPI/NVDEC на компьютерах)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-video-player"
path = "src/main.rs"

[dependencies]
synaptixd.workspace = true
synshell-common = { workspace = true, features = ["i18n", "style"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "ffmpeg", "wayland-dnd"] }
anyhow.workspace = true
libc.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
tracing.workspace = true
tracing-subscriber.workspace = true
syn-dlss.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# нейросетевые фильтры (synaptix-vfx: ядра CUDA) — только на компьютере
[target.'cfg(target_arch = "x86_64")'.dependencies]
synaptix-vfx.workspace = true
synaptix-bundle.workspace = true
