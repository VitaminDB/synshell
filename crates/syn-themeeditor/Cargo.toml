[package]
name = "syn-themeeditor"
description = "Редактор тем synshell: палитра, генерация из акцента и обоев, живой предпросмотр и примерка на всей системе, MSS-слои"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-themeeditor"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n", "style"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "code-editor"] }
synshell-tr.workspace = true
mss-analysis = { path = "../../../syngui/mss-analysis" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
