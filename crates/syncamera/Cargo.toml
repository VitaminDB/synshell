[package]
name = "syncamera"
description = "Камера synshell: фото, видео, ночь, таймлапс и ручной режим через службу камеры syncamd платформы"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syncamera"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
synsystem.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "ffmpeg", "image"] }
libc.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format"] }
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rqrr = "0.11"
serde_json.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
