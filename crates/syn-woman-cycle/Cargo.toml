[package]
name = "syn-woman-cycle"
description = "Женский календарь synshell: месячные, овуляция и фертильное окно — отметки, прогноз, история циклов"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-woman-cycle"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "svg"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "testing"] }

[package.metadata.syngui]
name = "Цикл"
description_en = "synshell cycle tracker: periods, ovulation, symptoms — data stays on the device"

[package.metadata.syngui.ios]
bundle_id = "io.github.vitamindb.syncycle"
icon_viewbox = "8 8 112 112"
icon_unround = 'rx="30"'
status_bar_hidden = true

[package.metadata.syngui.linux]
depends = ["synshell-core"]
