[package]
name = "syn-woman-cycle"
description = "Женский календарь synshell: месячные, овуляция и фертильное окно — отметки, прогноз, история циклов"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-woman-cycle"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "testing"] }
