[package]
name = "syn-video-editor"
description = "ИИ-видеоредактор synshell: монтаж силами агента, графы synaptix-flow, моушн-графика, шаблоны Fusion и LUT, нейрофильтры"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "syn_video_editor"
path = "src/lib.rs"

[[bin]]
name = "syn-video-editor"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n", "style"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "ffmpeg", "wayland-dnd", "svg", "accessibility"] }
syn-assist.workspace = true
synaptix-graph.workspace = true
syn-node-editor.workspace = true
synaptix-flow.workspace = true
synaptixd = { workspace = true, features = ["vfx-models"] }
synaptix-bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }

# нейрофильтры экспорта (synaptix-vfx: ядра CUDA) — только на компьютере
[target.'cfg(target_arch = "x86_64")'.dependencies]
synaptix-vfx.workspace = true

[dev-dependencies]
tempfile = "3"

[package.metadata.syngui]
app_id = "syn-video-editor"
title = "Видеоредактор"
