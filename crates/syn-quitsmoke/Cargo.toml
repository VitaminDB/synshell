[package]
name = "syn-quitsmoke"
description = "Бросить курить (QuitSmoke): постепенный или сразу, вехи здоровья, тяга, статистика, награды — для телефона и компьютера; Android: syngui build -t android -p syn-quitsmoke"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true

# Имя библиотеки прежнее: его загружает Android (android.app.lib_name = quitsmoke).
[lib]
name = "quitsmoke"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "syn-quitsmoke"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["syngui/clipboard", "syngui/image"]
android = ["syngui/android"]

[dependencies]
synshell-tr.workspace = true
syngui = { workspace = true, features = ["msdf", "effects", "winit", "material-icons", "i18n"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[package.metadata.syngui]
id = "com.quitsmoke.app"
name = "QuitSmoke"
description_en = "QuitSmoke: quit smoking or vaping tracker — milestones, health recovery, savings"

[package.metadata.syngui.android]
features = ["android"]
default_features = false
abis = ["arm64-v8a"]
min_sdk = 30
target_sdk = 35
permissions = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM"]
foreground_service = "quit_smoking_timer"

[package.metadata.syngui.linux]
depends = ["synshell-core"]
