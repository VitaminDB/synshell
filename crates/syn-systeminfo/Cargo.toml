[package]
name = "syn-systeminfo"
description = "Монитор ресурсов synshell: процессор, графика, видеопамять, NPU, память, сеть, диски, датчики, питание, процессы"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-systeminfo"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
synsystem.workspace = true
synaptixd.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image"] }
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
