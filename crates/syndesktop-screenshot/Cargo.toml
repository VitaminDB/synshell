[package]
name = "syndesktop-screenshot"
description = "Снимки экрана syndesktop: выделить область или окно, сохранить, скопировать"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syndesktop-screenshot"
path = "src/main.rs"

[dependencies]
syndesktop-common.workspace = true
syngui-layer.workspace = true
syngui = { workspace = true, features = ["winit", "clipboard", "msdf", "effects", "svg", "material-icons", "i18n"] }
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
log = "0.4"
env_logger = "0.11"
png = "0.17"
