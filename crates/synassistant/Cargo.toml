[package]
name = "synassistant"
description = "Ассистент synshell: чаты с системной нейросетью, инструменты системы, файлов, терминала, интернета и медиа"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synassistant"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image", "markdown-syntax"] }
synassist.workspace = true
synaptixd.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
