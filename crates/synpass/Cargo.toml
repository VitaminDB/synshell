[package]
name = "synpass"
description = "Пароли synshell: хранилище под мастер-паролем с синхронизацией и общим буфером обмена через synlink"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synpass"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
libc.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "clipboard", "i18n"] }
wl-clipboard-rs = "0.9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = "1"
