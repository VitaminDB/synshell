[package]
name = "syn-phone"
description = "Телефон synshell: набор, журнал, контакты, запись разговоров и экран звонка (и на экране блокировки) через демон модема synmodemd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synphone"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n", "style"] }
syn-modem.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "clipboard", "i18n", "image"] }
syn-system.workspace = true
serde.workspace = true
toml.workspace = true
libc.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
