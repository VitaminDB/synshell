[package]
name = "syn-remote"
description = "Пульт synshell: управление техникой через ИК-передатчик, база кодов Flipper-IRDB, автоподбор пульта"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syn-remote"
path = "src/main.rs"

[dependencies]
synshell-common = { workspace = true, features = ["i18n", "style"] }
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "i18n", "image"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
