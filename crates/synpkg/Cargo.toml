[package]
name = "synpkg"
description = "Установка программ synshell: pacman и AUR, для рабочего стола и телефона"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synpkg"
path = "src/main.rs"

[dependencies]
synshell-common.workspace = true
synsystem.workspace = true
syngui = { workspace = true, features = ["winit", "msdf", "effects", "material-icons", "clipboard", "i18n", "image", "svg"] }
