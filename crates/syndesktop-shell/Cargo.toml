[package]
name = "syndesktop-shell"
description = "Оболочка synshell: обои, панели, меню запуска, уведомления, OSD"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "syndesktop-shell"
path = "src/main.rs"

[dependencies]
synshell-common.workspace = true
syngui-layer.workspace = true
synsystem.workspace = true
syngui = { workspace = true, features = ["winit", "clipboard", "msdf", "effects", "svg", "material-icons", "i18n"] }
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log = "0.4"
env_logger = "0.11"
zbus = "5"
