[workspace]
resolver = "2"
members = [
    "crates/synshell-common",
    "crates/synaptix-graph",
    "crates/synaptix-flow",
    "crates/synshell-tr",
    "crates/syn-wm",
    "crates/syngui-layer",
    "crates/synshell-ui",
    "crates/syn-desktop-shell",
    "crates/syn-mobile-shell",
    "crates/syn-game-shell",
    "crates/syn-keyboard",
    "crates/syn-settings",
    "crates/syn-files",
    "crates/syn-fsd",
    "crates/syn-shot",
    "crates/syn-system",
    "crates/syn-pkg",
    "crates/syn-login",
    "crates/syn-link",
    "crates/syn-link-view",
    "crates/syn-droid",
    "crates/syn-modem",
    "crates/syn-sms",
    "crates/syn-pass",
    "crates/syn-phone",
    "crates/syn-camera",
    "crates/syn-media",
    "crates/syn-video-player",
    "crates/syn-audio-player",
    "crates/syn-audio-recorder",
    "crates/syn-terminal",
    "crates/syn-maps",
    "crates/syn-compass",
    "crates/syn-nfcd",
    "crates/syn-nfc",
    "crates/syn-remote",
    "crates/syn-wine-helper",
    "crates/syn-steam/setup",
    "crates/syn-woman-cycle",
    "crates/syn-health",
    "crates/syn-systeminfo",
    "crates/syn-vm",
    "crates/syn-vm-agent",
    "crates/syn-quitsmoke",
    "crates/syn-screencast",
    "crates/syn-gamepad",
    "crates/synaptixd",
    "crates/syn-assist",
    "crates/syn-assist-voice",
    "crates/syn-assistant",
    "crates/syn-notes",
    "crates/syn-notes-proto",
    "crates/syn-blocks",
    "crates/syn-dlss",
    "crates/syn-themeeditor",
    "crates/syn-epdtest",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Alexeyev Vitaly"]
license = "GPL-3.0-only"

[workspace.dependencies]
synshell-common = { path = "crates/synshell-common" }
synshell-tr = { path = "crates/synshell-tr" }
syn-assist = { path = "crates/syn-assist" }
syn-assist-voice = { path = "crates/syn-assist-voice" }
syn-notes-proto = { path = "crates/syn-notes-proto" }
syngui-layer = { path = "crates/syngui-layer" }
syn-system = { path = "crates/syn-system" }
syn-media = { path = "crates/syn-media" }
syn-dlss = { path = "crates/syn-dlss" }
syn-modem = { path = "crates/syn-modem" }
synshell-ui = { path = "crates/synshell-ui" }
syn-fsd = { path = "crates/syn-fsd", default-features = false }
synaptixd = { path = "crates/synaptixd", default-features = false }
synaptix-graph = { path = "crates/synaptix-graph" }
synaptix-flow = { path = "crates/synaptix-flow" }
synaptix = { git = "https://github.com/VitaminDB/synaptix.git", default-features = false }
synaptix-core = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-bundle = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-vfx = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-kernels-cpu = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-kernels-cuda = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-kernels-npu = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-asr-wav2vec2 = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-align-mfa = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-omnivoice = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-vibevoice = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-voxcpm = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-audio8 = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-supertonic = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-leokani = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-f5 = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-tts-silero = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-llm-common = { git = "https://github.com/VitaminDB/synaptix.git" }
synaptix-gen = { git = "https://github.com/VitaminDB/synaptix.git" }
syngui = { git = "https://github.com/VitaminDB/syngui.git", default-features = false }
mss-analysis = { git = "https://github.com/VitaminDB/syngui.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libc = "0.2"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 16
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Быстрая release-сборка для локальной работы: без LTO, параллельная
# кодогенерация, инкрементальная, без отладочной информации — в разы быстрее
# линкуется ценой 5–15% скорости. `cargo build --profile fast-release`
# (бинарники в target/fast-release). `--release` — только для публикаций.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = false

# smithay с исправлением для downstream-драйверов (Qualcomm sde): свойство
# alpha плана масштабируется под диапазон, который сообщает драйвер (0..255),
# иначе любой atomic-тест отвергается. Ветка synshell = v0.7.0 + патч.
[patch.crates-io]
smithay = { git = "https://github.com/VitaminDB/smithay", branch = "synshell" }
