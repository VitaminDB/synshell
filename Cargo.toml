[workspace]
resolver = "2"
members = [
    "crates/synshell-common",
    "crates/synwm",
    "crates/syngui-layer",
    "crates/synshell-ui",
    "crates/syndesktop-shell",
    "crates/synmobile-shell",
    "crates/synkeyboard",
    "crates/synsettings",
    "crates/synfiles",
    "crates/synshot",
    "crates/synsystem",
    "crates/synpkg",
    "crates/synlogin",
    "crates/synlink",
    "crates/synlink-view",
    "crates/syndroid",
    "crates/synmodem",
    "crates/synsms",
    "crates/synphone",
    "crates/syncamera",
    "crates/syn-video-player",
    "crates/syn-audio-player",
]

[workspace.package]
version = "0.1.41"
edition = "2021"
rust-version = "1.85"
authors = ["Alexeyev Vitaly"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
synshell-common = { path = "crates/synshell-common" }
syngui-layer = { path = "crates/syngui-layer" }
synsystem = { path = "crates/synsystem" }
synmodem = { path = "crates/synmodem" }
synshell-ui = { path = "crates/synshell-ui" }
syngui = { path = "../syngui/syngui", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libc = "0.2"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 16
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Быстрая release-сборка для локальной работы: без LTO, параллельная
# кодогенерация, инкрементальная, без отладочной информации — в разы быстрее
# линкуется ценой 5–15% скорости. `cargo build --profile fast-release`
# (бинарники в target/fast-release). `--release` — только для публикаций.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
debug = false

# smithay с исправлением для downstream-драйверов (Qualcomm sde): свойство
# alpha плана масштабируется под диапазон, который сообщает драйвер (0..255),
# иначе любой atomic-тест отвергается. Ветка synshell = v0.7.0 + патч.
[patch.crates-io]
smithay = { git = "https://github.com/VitaminDB/smithay", branch = "synshell" }
