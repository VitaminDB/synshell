[packages.synaptix]
description = "Служба нейросетей synaptix: языковые модели, речь, картинки и видео для всех программ — на видеокарте NVIDIA, Intel NPU или процессоре"
description_en = "synaptix neural-network service: language models, speech, images and video for all apps — on NVIDIA GPU, Intel NPU or CPU"
depends = ["gcc-libs"]
bins = ["synaptixd", "synaptixctl"]
backup = ["etc/synaptix/synaptixd.toml"]
dirs = ["usr/share/synaptix/models"]
optdepends = [
  "nvidia-utils: драйвер NVIDIA (libcuda) — нейросети на видеокарте",
  "cuda: компилятор ядер NVRTC для видеокарты NVIDIA",
  "openvino-intel-npu-plugin: нейросети на Intel NPU (Core Ultra), вместе с intel-npu-driver и intel-npu-compiler",
