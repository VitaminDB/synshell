  "intel-npu-compiler: компилятор графов Intel NPU",
]
optdepends_en = [
  "nvidia-utils: NVIDIA driver (NVENC, neural networks on the GPU)",
  "cuda: NVRTC kernel compiler for NVIDIA GPUs",
  "openvino-intel-npu-plugin: neural networks on Intel NPU (Core Ultra)",
  "intel-npu-driver: Intel NPU driver",
  "intel-npu-compiler: Intel NPU graph compiler",
]
files = [
  { from = "crates/synaptixd/data/synaptixd.service", to = "usr/lib/systemd/system/" },
  { from = "crates/synaptixd/data/synaptixd.toml", to = "etc/synaptix/" },
  { from = "docs/MODELS.md", to = "usr/share/doc/synaptix/" },
]

[packages.synaptix-model-leokani-tts-7m]
