# Выпуск synshell для `syngui package --workspace -f arch|tar|aur` (syngui-cli).
# Пакеты, файлы и метаданные pacman; описание полей — syngui/syngui-cli/README.md.
name = "synshell"
url = "https://github.com/VitaminDB/synshell"
license = ["GPL-3.0-only"]
maintainer = "Alexeyev Vitaly"
makedepends = ["cargo", "rust", "git", "clang", "pkgconf", "mesa", "libinput", "seatd", "libxkbcommon", "libdrm", "fontconfig", "freetype2", "dbus", "ffmpeg", "sqlite", "libarchive", "pipewire", "alsa-lib", "fuse3"]
# C-части крейтов (ring, zstd) с -flto из makepkg.conf не линкуются с Rust.
options = ["!lto"]

# Служба нейросетей: cuda (NVIDIA), npu (Intel); без них — только процессор. SYNAPTIXD_FEATURES=cuda — переопределить.
[crates.synaptixd]
features = ["cuda", "npu"]
features_env = "SYNAPTIXD_FEATURES"

[packages.synshell]
description = "Окружение рабочего стола synshell: основа и приложения (без нейросетей)"
description_en = "synshell desktop environment: core and applications (without the neural-network service)"
depends = ["synshell-core", "synshell-link", "synshell-game", "syn-notes", "syn-vm", "syn-video-player", "syn-audio-player", "syn-audio-recorder", "synpass", "syn-maps", "syn-remote", "syn-systeminfo", "syn-themeeditor", "syn-woman-cycle", "syndroid", "syn-wine-helper", "syncamera", "syn-blocks"]
optdepends = [
  "synshell-ai: ассистент (нужна служба нейросетей synaptix)",
  "synshell-mobile: оболочка и службы телефона",
]
optdepends_en = [
  "synshell-ai: assistant (needs the synaptix service)",
  "synshell-mobile: phone shell and services",
]

[packages.synshell-core]
description = "synshell: композитор synwm, оболочка, экран входа, клавиатура, снимки и показ экрана, параметры, проводник, терминал, установка программ"
description_en = "synshell: synwm compositor, shell, login screen, on-screen keyboard, screenshots and screen sharing, settings, file manager, terminal, software center"
depends = ["mesa", "libinput", "seatd", "systemd-libs", "libxkbcommon", "libdrm", "pixman", "vulkan-icd-loader", "fontconfig", "freetype2", "ttf-font", "breeze-icons", "breeze-cursors", "hicolor-icon-theme", "dbus", "pam", "alsa-lib", "ffmpeg", "sqlite", "libarchive", "xdg-desktop-portal", "pipewire", "libpipewire"]
bins = ["synwm", "syndesktop-shell", "synlogin", "synkeyboard", "syn-screencast", "synfsd"]
apps = ["synsettings", "synpkg", "synfiles", "synshot", "syn-terminal"]
provides = ["syndesktop"]
conflicts = ["syndesktop"]
replaces = ["syndesktop"]
optdepends = [
  "xorg-xwayland: X11-программы",
  "wireplumber: громкость (wpctl)",
  "sound-theme-freedesktop: звуковая тема freedesktop (запасная для событий)",
  "brightnessctl: яркость",
  "networkmanager: апплет сети",
  "iwd: Wi-Fi (или networkmanager)",
  "bluez: Bluetooth",
  "playerctl: мультимедийные клавиши",
  "wl-clipboard: снимки и пути к ним в буфер обмена",
  "xdg-desktop-portal-kde: запасной портал выбора файлов",
  "shared-mime-info: типы файлов в проводнике",
  "ffmpegthumbnailer: миниатюры видео в проводнике",
  "libheif: HEIC/HEIF/AVIF в просмотрщике и миниатюрах",
  "imagemagick: редкие форматы картинок (JPEG XL, RAW…) в просмотрщике",
  "archlinux-appstream-data: категории, значки и снимки программ в synpkg",
  "polkit: установка программ (synpkg) без root",
  "base-devel: сборка пакетов AUR в synpkg",
  "pacman-contrib: проверка обновлений без root (checkupdates)",
  "udisks2: флешки и диски в проводнике",
  "gvfs-mtp: телефоны Android в проводнике (MTP)",
  "gvfs-gphoto2: камеры в проводнике (PTP)",
  "gvfs-afc: iPhone в проводнике",
  "gvfs-smb: сетевые папки Windows и Samba в проводнике",
  "git: метки git в проводнике",
  "fuse3: архивы как папки в проводнике",
  "intel-media-driver: аппаратное видео на Intel",
  "libva-mesa-driver: аппаратное видео на AMD",
  "nvidia-utils: кодер NVENC",
]
optdepends_en = [
  "xorg-xwayland: X11 applications",
  "wireplumber: volume control (wpctl)",
  "sound-theme-freedesktop: freedesktop sound theme (event fallback)",
  "brightnessctl: brightness",
  "networkmanager: network applet",
  "iwd: Wi-Fi (or networkmanager)",
  "bluez: Bluetooth",
  "playerctl: media keys",
  "wl-clipboard: screenshots and paths to the clipboard",
  "xdg-desktop-portal-kde: fallback file chooser portal",
  "shared-mime-info: file types in the file manager",
  "ffmpegthumbnailer: video thumbnails in the file manager",
  "libheif: HEIC/HEIF/AVIF in the image viewer and thumbnails",
  "imagemagick: rare image formats (JPEG XL, RAW…) in the image viewer",
  "archlinux-appstream-data: categories, icons and screenshots in the software center",
  "polkit: installing software without root",
  "base-devel: building AUR packages in the software center",
  "pacman-contrib: update checks without root (checkupdates)",
  "udisks2: USB drives and disks in the file manager",
  "gvfs-mtp: Android phones in the file manager (MTP)",
  "gvfs-gphoto2: cameras in the file manager (PTP)",
  "gvfs-afc: iPhone in the file manager",
  "gvfs-smb: Windows and Samba shares in the file manager",
  "git: git status in the file manager",
  "fuse3: archives as folders; files of linked devices",
  "intel-media-driver: hardware video on Intel",
  "libva-mesa-driver: hardware video on AMD",
  "nvidia-utils: NVIDIA driver (NVENC, neural networks on the GPU)",
]
install = "packaging/synshell-core.install"
files = [
  { from = "crates/syn-files/data/synfiles-viewer.desktop", to = "usr/share/applications/" },
  { from = "data/synshell-session", to = "usr/bin/", mode = "755" },
  { from = "data/synshell.desktop", to = "usr/share/wayland-sessions/" },
  { from = "data/sounds/themes/*", to = "usr/share/sounds/" },
  { from = "data/synshell-portals.conf", to = "usr/share/xdg-desktop-portal/" },
  { from = "data/synshell.portal", to = "usr/share/xdg-desktop-portal/portals/" },
  { from = "crates/syn-pkg/data/pacman-helper", to = "usr/lib/synpkg/", mode = "755" },
  { from = "crates/syn-pkg/data/org.synshell.synpkg.policy", to = "usr/share/polkit-1/actions/" },
  { run = "echo '[Default Applications]'; cat crates/*/data/defaults.mimeapps | grep -v '^#' | grep '='", to = "usr/share/applications/synshell-mimeapps.list" },
  { from = "crates/synshell-ui/data/syndesktop-lock.pam", to = "etc/pam.d/syndesktop-lock" },
  { from = "crates/syn-login/data/synlogin.pam", to = "etc/pam.d/synlogin" },
  { from = "crates/syn-login/data/synlogin.service", to = "usr/lib/systemd/system/" },
  { from = "crates/syn-fsd/data/synfsd.service", to = "usr/lib/systemd/system/" },
  { from = "docs/FSD.md", to = "usr/share/doc/synshell/" },
  { from = "crates/synshell-common/default-config.toml", to = "usr/share/doc/synshell/config.toml.example" },
]
links = { "usr/bin/syndesktop" = "synwm" }

