[packages.syn-remote]
description = "Пульт synshell: управление техникой через ИК-передатчик"
description_en = "synshell remote control: IR blaster and smart TVs"
depends = ["synshell-core"]
apps = ["syn-remote"]
groups = ["synshell-apps"]

[packages.syn-systeminfo]
description = "Монитор ресурсов synshell: процессор, графика, память, диски, сеть"
description_en = "synshell system monitor: processes, CPU, GPU, memory, disks, network"
depends = ["synshell-core"]
apps = ["syn-systeminfo"]
groups = ["synshell-apps"]

[packages.syn-themeeditor]
description = "Редактор тем synshell: палитра, генерация из акцента и обоев, живой просмотр"
description_en = "synshell theme editor with live preview"
depends = ["synshell-core"]
apps = ["syn-themeeditor"]
groups = ["synshell-apps"]

[packages.syn-woman-cycle]
description = "Женский календарь synshell"
description_en = "synshell cycle tracker: periods, ovulation, symptoms — data stays on the device"
depends = ["synshell-core"]
apps = ["syn-woman-cycle"]
groups = ["synshell-apps"]

[packages.syndroid]
description = "Android-приложения в synshell: контейнер LineageOS"
description_en = "synshell Android container: run Android apps on the desktop"
depends = ["synshell-core"]
bins = ["syndroidd"]
apps = ["syndroid"]
groups = ["synshell-apps"]
files = [
  { from = "crates/syn-droid/systemd/syndroid.service", to = "usr/lib/systemd/system/" },
]

[packages.syn-wine-helper]
description = "Компоненты Wine synshell: DLL и рантаймы, которых нет в Wine"
description_en = "synshell Wine helper: run Windows games and programs"
depends = ["synshell-core"]
apps = ["syn-wine-helper"]
groups = ["synshell-apps"]

[packages.syncamera]
description = "Камера synshell: фото, видео, ночь, таймлапс"
description_en = "synshell camera: photos, video, night mode"
depends = ["synshell-core"]
apps = ["syncamera"]
groups = ["synshell-apps"]

[packages.syn-blocks]
description = "Syn Blocks — головоломка 8×8"
description_en = "synshell puzzle game with blocks"
depends = ["synshell-core"]
apps = ["syn-blocks"]
groups = ["synshell-apps"]

[packages.syn-epdtest]
# Инструмент разработчика (панели ONYX BOOX) — в архивах выпуска, не в AUR.
aur = false
description = "Тест экрана E Ink synshell (для разработчиков)"
description_en = "synshell E Ink display test"
depends = ["synshell-core"]
apps = ["syn-epdtest"]

[packages.syn-quitsmoke]
description = "Бросить курить (QuitSmoke): постепенно или сразу, вехи здоровья, тяга, статистика, награды"
description_en = "QuitSmoke: quit smoking or vaping tracker — milestones, health recovery, savings"
depends = ["synshell-core"]
apps = ["syn-quitsmoke"]
