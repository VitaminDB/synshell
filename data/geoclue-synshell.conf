# GeoClue: агент местоположения — оболочка synshell (synshell-ui/src/location.rs, syn-system/src/geoclue_agent.rs).
# Она решает по [location] своего конфига (выключатель «Местоположение» в Параметрах и шторке, запомненные
# «Разрешить/Запретить») и спрашивает пользователя о незнакомых программах. Без агента в этом списке GeoClue
# не отдаёт местоположение никому. Прочие агенты из geoclue.conf оставлены для других сеансов (GNOME, Phosh…).
# GeoClue перечитывает конфиг при запуске (он запускается по D-Bus и выходит после минуты простоя).
[agent]
whitelist=synshell;geoclue-demo-agent;gnome-shell;io.elementary.desktop.agent-geoclue2;sm.puri.Phosh;lipstick
