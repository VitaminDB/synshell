[preferred]
default=kde;gtk;
# показ и снимки экрана: выбор монитора — диалог оболочки, захват — syn-screencast
# (кадры synwm по wlr-screencopy прямо в буферы PipeWire; synsystem::portal_screencast)
org.freedesktop.impl.portal.ScreenCast=synshell;
org.freedesktop.impl.portal.Screenshot=synshell;
# выбор файлов: окно Проводника synfiles (synsystem::portal_files)
org.freedesktop.impl.portal.FileChooser=synshell;kde;gtk;
# доступ программ к устройствам (портал Camera и др.): диалог оболочки (synsystem::portal_access)
org.freedesktop.impl.portal.Access=synshell;
